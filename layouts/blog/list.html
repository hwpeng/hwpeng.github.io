{{ partial "header.html" . }}

{{if not .IsHome }}
<h1>{{ .Title | markdownify }}</h1>
{{ end }}

{{ .Content }}

<ul>
  {{ $pages := partial "all-blog-pages.html" . }}
  {{ range $pages }}
  <li>
    <span class="date">{{ .Date.Format "2006/01/02" }}</span>
    {{ partial "blog-title.html" . }}
  </li>
  {{ end }}
</ul>

{{ partial "footer.html" . }}
