{{ partial "header.html" . }}

{{ .Content }}

<ul>
  {{ $pages := partial "all-blog-pages.html" . }}
  {{ range $pages }}
    <li>
      <span class="date">{{ .Date.Format "2006/01/02" }}</span>
      <a href="{{ .RelPermalink }}">{{ .Title | markdownify }}</a>
    </li>
  {{ end }}
</ul>

{{ partial "footer.html" . }}
