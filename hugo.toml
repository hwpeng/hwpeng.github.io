baseURL = "https://hwpeng.github.io/"
theme = ["xmin"]

title = ' HwP: Hardware Programmer'
author = "Huwan Peng"
copyright = "Copyright © 2025, Huwan Peng."
languageCode = "en-US"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "Blog"
    url = "/blog/"
    weight = 2
