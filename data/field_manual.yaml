sections:
  - number: "01"
    id: "foundations"
    title: "Architecture Foundations & Methodology"
    summary: "Turn product intent and workload behavior into defensible system trade-offs."
    prerequisites: "Start here"
    groups:
      - title: "Decision framing"
        topics:
          - title: "Requirements, constraints, and architecture contracts"
            priority: "Core"
            why: "Translate product goals into explicit quality, latency, throughput, power, cost, and compatibility targets."
          - title: "Workload decomposition and critical paths"
            priority: "Core"
            why: "Separate phases, operators, and data flows so optimization effort lands on the part that controls the outcome."
      - title: "Quantitative intuition"
        topics:
          - title: "Roofline, arithmetic intensity, and machine balance"
            priority: "Core"
            why: "Quickly distinguish compute limits from bandwidth limits and estimate which resource an architecture must add."
          - title: "Amdahl’s law, queueing, and tail latency"
            priority: "Core"
            why: "Expose serial bottlenecks and understand why average throughput alone cannot predict user-visible performance."
      - title: "Design methodology"
        topics:
          - title: "Design-space exploration, sensitivity, and Pareto fronts"
            priority: "Core"
            why: "Compare alternatives across competing objectives instead of optimizing one metric in isolation."
          - title: "Model fidelity, calibration, and uncertainty"
            priority: "Important"
            why: "Know when an analytical model, simulator, trace, or prototype is accurate enough to support a decision."

  - number: "02"
    id: "workloads"
    title: "AI Workloads"
    summary: "Study workload properties only when they change compute, memory, communication, or scheduling requirements."
    prerequisites: "01"
    groups:
      - title: "Architecturally distinct structures"
        topics:
          - title: "Dense Transformer execution"
            priority: "Core"
            why: "The balance among matrix operations, attention, normalization, and elementwise work defines the baseline compute and memory system."
          - title: "Mixture-of-Experts execution"
            priority: "Core"
            why: "Sparse routing changes weight residency, all-to-all traffic, load balance, and the useful ratio of bandwidth to arithmetic."
      - title: "Phase behavior"
        topics:
          - title: "Training, prefill, and decode"
            priority: "Core"
            why: "Their different parallelism, batch shapes, reuse, and compute-to-memory ratios can justify different hardware and deployment partitions."
          - title: "MHA, MQA, GQA, MLA, and attention variants"
            priority: "Important"
            why: "Attention structure matters because it directly changes KV capacity, memory bandwidth, kernel shape, and communication."
      - title: "Shapes, state, and traffic"
        topics:
          - title: "Sequence length, batch size, and shape distributions"
            priority: "Core"
            why: "Shape distributions determine array utilization, tiling efficiency, cache pressure, and whether peak throughput is reachable."
          - title: "Long context, persistent state, and irregular request graphs"
            priority: "Important"
            why: "These traits enter the main path only when they materially change memory capacity, reuse, scheduling, or data movement."

  - number: "03"
    id: "numerics"
    title: "Numerical Formats & Quantization"
    summary: "Connect every compression method to its bandwidth savings, storage impact, decode cost, and datapath consequence."
    prerequisites: "01 → 02"
    groups:
      - title: "Format → datapath"
        topics:
          - title: "Dynamic range, precision, rounding, and accumulation"
            priority: "Core"
            why: "Numerical behavior determines multiplier width, accumulator design, scaling hardware, conversion points, and error margin."
          - title: "BF16, FP16, TF32, FP8, FP4, and integer formats"
            priority: "Core"
            why: "Format choice jointly changes HBM traffic, SRAM capacity, datapath area, throughput, conversion overhead, and software support."
      - title: "Tensor-specific compression"
        topics:
          - title: "Weight quantization and codebook-based compression"
            priority: "Core"
            why: "Weight compression trades HBM capacity and bandwidth against dequantization throughput, metadata storage, and decoder complexity."
          - title: "Activation quantization"
            priority: "Important"
            why: "Activation formats affect SRAM footprint, interconnect width, outlier handling, and the precision supported by every compute stage."
          - title: "KV-cache quantization"
            priority: "Important"
            why: "KV compression directly changes serving capacity and memory traffic but adds format conversion and attention-kernel constraints."
      - title: "Architecture realization"
        topics:
          - title: "QTIP and high-dimensional vector quantization"
            priority: "Frontier"
            href: "/note/qtip/"
            status: "Done"
            why: "QTIP tests whether aggressive weight-bandwidth reduction can justify a structured state machine and on-the-fly decoder."
          - title: "Microscaling and block-scaled formats"
            priority: "Frontier"
            why: "Scale granularity trades numerical robustness against metadata bandwidth, SRAM layout, and shared scaling logic in the datapath."
          - title: "Structured sparsity"
            priority: "Important"
            why: "Sparsity matters only when metadata, load balance, memory layout, and sparse execution produce an end-to-end architectural win."
          - title: "Compression break-even analysis"
            priority: "Core"
            why: "Compare bytes saved with decoder instructions, extra SRAM reads, control cost, and quality loss before committing hardware support."

  - number: "04"
    id: "compute"
    title: "Compute Architecture"
    summary: "Design execution resources around real tensor shapes, reuse, and control behavior."
    prerequisites: "01 → 02 → 03"
    groups:
      - title: "Datapaths"
        topics:
          - title: "Tensor arrays, systolic execution, and matrix engines"
            priority: "Core"
            why: "Array organization determines peak throughput, operand movement, supported shapes, and utilization."
          - title: "Vector, SIMD, scalar, and special-function units"
            priority: "Important"
            why: "Non-matrix work can become the critical path when an architecture over-invests in headline tensor throughput."
      - title: "Dataflow and utilization"
        topics:
          - title: "Weight-, output-, and row-stationary dataflows"
            priority: "Core"
            why: "Dataflow determines which operands are reused locally and therefore which bandwidth and storage costs dominate."
          - title: "Shape sensitivity, tiling, scheduling, and occupancy"
            priority: "Core"
            why: "Real workloads rarely match ideal array dimensions, so achieved performance depends on how fragments fill the machine."
      - title: "Specialization choices"
        topics:
          - title: "Low-precision and sparsity-aware datapaths"
            priority: "Important"
            why: "Format conversion, metadata handling, and irregular zeros decide whether theoretical efficiency becomes usable speedup."
          - title: "Programmability versus fixed-function acceleration"
            priority: "Core"
            why: "The right boundary between flexibility and specialization controls both time-to-market and lifetime efficiency."

  - number: "05"
    id: "memory"
    title: "Memory Systems"
    summary: "Treat data movement, capacity, and locality as first-class architecture constraints."
    prerequisites: "01 → 02; supports 04"
    groups:
      - title: "Hierarchy"
        topics:
          - title: "Registers, SRAM, caches, scratchpads, HBM, and host memory"
            priority: "Core"
            why: "Every level trades capacity, latency, bandwidth, energy, and programmability differently."
          - title: "Banking, ports, conflicts, and address mapping"
            priority: "Core"
            why: "Nominal bandwidth is irrelevant when access patterns collide on banks or cannot reach enough ports."
      - title: "Locality and movement"
        topics:
          - title: "Tiling, prefetching, double buffering, and compression"
            priority: "Core"
            why: "Movement scheduling determines whether compute waits for data and how much storage is needed to hide latency."
          - title: "Virtual memory, TLBs, paging, and memory protection"
            priority: "Important"
            why: "Large dynamic workloads need isolation and flexible allocation without translation and fault costs dominating execution."
      - title: "AI-specific state"
        topics:
          - title: "KV-cache layout, allocation, eviction, and reuse"
            priority: "Core"
            why: "KV state often controls inference capacity, fragmentation, bandwidth, and scheduling freedom."
          - title: "HBM evolution and memory-system scaling"
            priority: "Important"
            why: "Stack count, channel organization, pin bandwidth, capacity, and package limits constrain complete accelerator designs."

  - number: "06"
    id: "noc"
    title: "On-Chip Communication"
    summary: "Move tensors and synchronization through the die without making the fabric the bottleneck."
    prerequisites: "04 + 05"
    groups:
      - title: "NoC fundamentals"
        topics:
          - title: "Topology, routing, flow control, and buffering"
            priority: "Core"
            why: "These choices set latency, throughput, area, and how gracefully the chip handles hot spots."
          - title: "Deadlock, ordering, QoS, and isolation"
            priority: "Core"
            why: "Correctness and predictable service matter when many engines and traffic classes share the same fabric."
      - title: "AI traffic patterns"
        topics:
          - title: "Multicast, reduction, broadcast, and collective support"
            priority: "Important"
            why: "Native support for repeated AI communication patterns can save bandwidth and synchronization overhead."
          - title: "Placement, mapping, and locality-aware scheduling"
            priority: "Core"
            why: "Logical operator placement determines physical hop count, contention, and energy."
      - title: "Emerging fabrics"
        topics:
          - title: "In-network compute and collective engines"
            priority: "Frontier"
            why: "Moving simple reductions into the fabric may reduce data motion and expose new accelerator partitioning options."
          - title: "Photonic and heterogeneous on-chip links"
            priority: "Optional"
            why: "Alternative links may become relevant when electrical reach, bandwidth density, or power limits dominate large dies."

  - number: "10"
    id: "interconnect"
    title: "Scale-Up & Scale-Out Interconnect"
    summary: "Choose the fabric hierarchy that turns many accelerators into one useful system."
    prerequisites: "05 → 06 → 07"
    groups:
      - title: "Fabric hierarchy"
        topics:
          - title: "Host I/O, PCIe, CXL, and memory semantics"
            priority: "Important"
            why: "Host attachment and coherent or pooled memory options define system composition and movement boundaries."
          - title: "Scale-up fabrics: NVLink/NVSwitch, UALink, and peers"
            priority: "Core"
            why: "Low-latency accelerator fabrics determine pod size, memory reach, collective performance, and vendor flexibility."
      - title: "Scale-out networks"
        topics:
          - title: "InfiniBand, Ethernet, Ultra Ethernet, and RDMA"
            priority: "Core"
            why: "Transport behavior and NIC offload determine whether large jobs retain efficiency across racks."
          - title: "Topology, routing, multipathing, and congestion control"
            priority: "Core"
            why: "Tail behavior under synchronized AI traffic often matters more than isolated link bandwidth."
      - title: "Communication execution"
        topics:
          - title: "Collectives, topology-aware algorithms, and overlap"
            priority: "Core"
            why: "All-reduce, all-gather, reduce-scatter, and all-to-all connect parallelization choices to fabric cost."
          - title: "SmartNICs, DPUs, optical I/O, and in-network collectives"
            priority: "Frontier"
            why: "Offload and optical reach can shift the boundary between accelerator, switch, and network architecture."

  - number: "11"
    id: "training"
    title: "Distributed Training"
    summary: "Map model state and computation across a cluster while preserving convergence and utilization."
    prerequisites: "02 + 03 + 05 + 08 + 10"
    groups:
      - title: "Parallel decomposition"
        topics:
          - title: "Data, tensor, pipeline, sequence, context, and expert parallelism"
            priority: "Core"
            why: "Each parallel axis moves different tensors and creates different memory, communication, and scaling limits."
          - title: "Optimizer, parameter, gradient, and activation sharding"
            priority: "Core"
            why: "State placement determines the minimum memory per accelerator and the traffic needed to reconstruct work."
      - title: "Execution efficiency"
        topics:
          - title: "Pipeline schedules, bubbles, microbatching, and recomputation"
            priority: "Core"
            why: "Schedule structure trades activation memory, latency, and idle time across stages."
          - title: "Communication overlap and topology-aware placement"
            priority: "Core"
            why: "Good mapping hides collective latency and avoids placing the most demanding traffic on the weakest links."
      - title: "Operations at scale"
        topics:
          - title: "Checkpointing, fault tolerance, and straggler control"
            priority: "Core"
            why: "Long jobs on large clusters must survive component failures without losing unacceptable time or capacity."
          - title: "Data pipelines, storage, and cluster scheduling"
            priority: "Important"
            why: "Input and orchestration systems must continuously feed expensive accelerators and coordinate shared infrastructure."

  - number: "09"
    id: "inference"
    title: "Inference & Serving Systems"
    summary: "Turn model execution into predictable, efficient service under dynamic demand."
    prerequisites: "02 + 03 + 05 + 08; scales through 10"
    groups:
      - title: "Service objectives"
        topics:
          - title: "TTFT, ITL, latency percentiles, throughput, goodput, and SLA"
            priority: "Core"
            why: "These metrics capture different user and fleet goals and prevent optimizing tokens per second in a vacuum."
          - title: "Admission control, queueing, fairness, and overload behavior"
            priority: "Core"
            why: "A serving design must remain predictable when request lengths, priorities, and arrival rates change."
      - title: "Runtime scheduling"
        topics:
          - title: "Continuous batching, chunked prefill, and iteration scheduling"
            priority: "Core"
            why: "Scheduler policy trades utilization against interactivity and shapes every downstream kernel batch."
          - title: "Paged KV memory, prefix caching, and RadixAttention"
            priority: "Core"
            why: "State reuse and allocation determine capacity and the economics of repeated or shared context."
      - title: "Latency and scale techniques"
        topics:
          - title: "Speculative decoding, EAGLE, MTP, and verification"
            priority: "Important"
            why: "Generating multiple candidate tokens can reduce serial decode steps when acceptance and draft cost are favorable."
          - title: "Prefill–decode disaggregation and KV transfer"
            priority: "Frontier"
            why: "Independent phase scaling can better match unlike compute profiles but introduces placement and transfer costs."
      - title: "Production stacks"
        topics:
          - title: "vLLM, SGLang, TensorRT-LLM, and runtime trade-offs"
            priority: "Core"
            why: "Comparing real engines reveals how scheduling, kernels, memory management, and hardware support interact."
          - title: "MoE serving, MegaMoE, and hierarchical agentic caches"
            priority: "Frontier"
            why: "Sparse experts and persistent agent state create new opportunities for disaggregation, fusion, and cache hierarchy."

  - number: "08"
    id: "software-stack"
    title: "Compiler, Runtime & Kernels"
    summary: "Understand the software mechanisms that convert architecture potential into realized performance."
    prerequisites: "02 + 03 + 04 + 05 + 06; feeds 09–11"
    groups:
      - title: "Compilation path"
        topics:
          - title: "Graphs, IRs, lowering, fusion, and shape specialization"
            priority: "Core"
            why: "Compiler boundaries determine which cross-operator optimizations and hardware features are expressible."
          - title: "Cost models, autotuning, and code generation"
            priority: "Important"
            why: "Search and feedback are needed when one static schedule cannot serve every shape and architecture."
      - title: "Kernel mechanics"
        topics:
          - title: "GPU execution, occupancy, memory coalescing, and synchronization"
            priority: "Core"
            why: "Kernel performance follows from how work maps onto threads, warps, memory, and synchronization resources."
          - title: "GEMM, GEMV, attention, and grouped-MoE kernels"
            priority: "Core"
            why: "These primitives dominate modern model execution and expose different compute, bandwidth, and scheduling constraints."
      - title: "Execution reduction"
        topics:
          - title: "FlashAttention, FlashMLA, fusion, and CUDA Graphs"
            priority: "Important"
            why: "Reducing intermediate traffic and launch overhead is often as valuable as adding raw arithmetic throughput."
          - title: "Persistent kernels, MegaKernel, and Mirage MPK"
            priority: "Frontier"
            why: "End-to-end persistent execution challenges operator-by-operator runtimes and may reshape control and memory requirements."
      - title: "Programming systems"
        topics:
          - title: "CUDA, CUTLASS/CuTe, Triton, FlyDSL, and MLIR"
            priority: "Core"
            why: "Programming abstractions control portability, achievable optimization, and how quickly new hardware becomes useful."
          - title: "Runtime feedback and adaptive compilation"
            priority: "Frontier"
            why: "Workload-aware recompilation can specialize execution as shapes, traffic, and hardware conditions change."

  - number: "07"
    id: "packaging-vlsi"
    title: "Advanced Packaging & VLSI"
    summary: "Connect logical architecture to physical limits, integration choices, and manufacturability."
    prerequisites: "04 + 05 + 06"
    groups:
      - title: "Physical implementation"
        topics:
          - title: "PPA, floorplanning, clocking, power grids, and signoff"
            priority: "Core"
            why: "A logical block diagram is not an architecture until timing, area, power delivery, and physical proximity close."
          - title: "Process scaling, GAA devices, backside power, and SRAM limits"
            priority: "Important"
            why: "Device and memory scaling trends determine what improves with a new node and what becomes the limiting resource."
      - title: "Heterogeneous integration"
        topics:
          - title: "2.5D interposers, bridges, CoWoS, and HBM integration"
            priority: "Core"
            why: "Package topology determines available memory stacks, die area, link energy, and total system bandwidth."
          - title: "Chiplets, die-to-die interfaces, and UCIe"
            priority: "Core"
            why: "Partitioning changes yield, reuse, process choice, latency, and the organizational boundary of the system."
      - title: "Vertical and wafer-scale systems"
        topics:
          - title: "Hybrid bonding, 3D logic, 3D DRAM, and memory-on-logic"
            priority: "Frontier"
            why: "Short vertical links promise much higher bandwidth density but create thermal, yield, test, and power challenges."
          - title: "Wafer-scale integration and System-on-Wafer"
            priority: "Frontier"
            why: "Reticle-spanning systems trade conventional packaging boundaries for fabric, yield-recovery, cooling, and software complexity."
      - title: "Manufacturing system"
        topics:
          - title: "Yield, redundancy, known-good-die, test, and repair"
            priority: "Core"
            why: "Manufacturing yield and recoverability can decide whether a large integrated architecture is economically viable."
          - title: "Co-packaged optics and optical I/O"
            priority: "Frontier"
            why: "Bringing optics closer to compute may relieve electrical reach and bandwidth-density limits at package and rack scale."

  - number: "12"
    id: "power-reliability"
    title: "Power, Thermal & Reliability"
    summary: "Design within the electrical, cooling, and failure envelope of real deployments."
    prerequisites: "04 + 05 + 07 + 10"
    groups:
      - title: "Energy and delivery"
        topics:
          - title: "Dynamic, leakage, memory, I/O, and data-movement energy"
            priority: "Core"
            why: "A complete power breakdown shows whether to optimize arithmetic, storage, communication, or idle behavior."
          - title: "DVFS, power gating, voltage droop, and power delivery"
            priority: "Core"
            why: "Performance is limited by what the package and rack can deliver safely, not only by nominal silicon capability."
      - title: "Thermal architecture"
        topics:
          - title: "Hotspots, thermal coupling, air, liquid, and immersion cooling"
            priority: "Core"
            why: "Cooling choice feeds back into floorplan, package, rack density, sustained frequency, and facility design."
          - title: "3D-stack thermal paths and thermal-aware scheduling"
            priority: "Frontier"
            why: "Vertical integration increases heat density and may require runtime cooperation to sustain performance."
      - title: "Reliability at scale"
        topics:
          - title: "ECC, RAS, fault containment, checkpoint, and recovery"
            priority: "Core"
            why: "Large systems experience frequent component faults, so recovery cost and failure domains belong in the architecture."
          - title: "Variation, aging, electromigration, and graceful degradation"
            priority: "Important"
            why: "Lifetime and manufacturing variation determine safe margins and whether redundant resources have system value."

  - number: "13"
    id: "economics"
    title: "Cost, TCO & Datacenter Architecture"
    summary: "Judge architecture by useful work delivered over its full deployed life."
    prerequisites: "01 + 09 + 10 + 11 + 12"
    groups:
      - title: "Unit economics"
        topics:
          - title: "Cost per token, tokens per watt, utilization, and goodput"
            priority: "Core"
            why: "Normalized service metrics connect microarchitecture decisions to fleet-level value."
          - title: "CAPEX, OPEX, depreciation, and deployment lifetime"
            priority: "Core"
            why: "The cheapest chip may not be the lowest-cost system once energy, networking, downtime, and refresh cycles are included."
      - title: "Facility architecture"
        topics:
          - title: "Rack power, cooling loops, network tiers, and storage"
            priority: "Core"
            why: "Facility limits determine achievable accelerator density and how compute can be composed into deployable units."
          - title: "Capacity planning, traffic mix, and fleet scheduling"
            priority: "Core"
            why: "Demand variability and fragmentation decide how much installed capacity becomes useful work."
      - title: "Supply and sustainability"
        topics:
          - title: "HBM, packaging, yield, supply constraints, and time-to-market"
            priority: "Important"
            why: "An architecture that depends on scarce components or immature capacity may lose even with better peak performance."
          - title: "Energy sourcing, water, carbon, and regional constraints"
            priority: "Optional"
            why: "Infrastructure location and sustainability constraints can change operating cost, permitting, and available power."

  - number: "14"
    id: "frontier"
    title: "Frontier Technologies & Architecture Bets"
    summary: "A dated prediction log: explicit 3–5 year hypotheses, evidence to watch, and reasons to change my mind."
    as_of: "Baseline · August 2026"
    prerequisites: "Synthesize 03–13"
    groups:
      - title: "Memory and integration bets"
        topics:
          - title: "3D logic–memory integration and next-generation 3D DRAM"
            priority: "Frontier"
            why: "If thermal and yield problems are solved, vertical memory could reset the bandwidth and energy balance of AI compute."
            prediction: "At least one production AI accelerator family will adopt materially tighter logic–memory integration than today’s 2.5D HBM baseline for a bandwidth-critical tier."
            watch: "Hybrid-bond pitch, sustained thermal density, yield, repairability, and whether software can exploit the new memory tier."
          - title: "CXL pooling, disaggregated memory, and composable systems"
            priority: "Frontier"
            why: "Shared capacity could improve utilization while adding latency, fabric dependence, and new failure domains."
            prediction: "CXL-backed pooled memory will become a useful capacity tier for selected AI workloads, but will not replace local HBM for bandwidth-critical tensors."
            watch: "End-to-end access latency, pooling utilization, page placement, failure isolation, and production software support."
      - title: "Communication bets"
        topics:
          - title: "Co-packaged optics, silicon photonics, and optical fabrics"
            priority: "Frontier"
            why: "Optics may become necessary as electrical I/O reaches power and reach limits from package to datacenter."
            prediction: "Optical I/O will move closer to the package in scale-up systems as electrical reach and I/O power become harder constraints."
            watch: "Energy per bit, laser integration, reliability, serviceability, manufacturing yield, and complete link economics."
          - title: "In-network compute and programmable collective fabrics"
            priority: "Frontier"
            why: "Computing inside the fabric can reduce bytes moved but couples algorithms to network capabilities."
            prediction: "Reduction and collective offload will become a selectable architectural capability in leading AI scale-up fabrics."
            watch: "Programming models, workload generality, congestion interaction, observability, and the silicon cost of fabric compute."
      - title: "Compute bets"
        topics:
          - title: "Near-memory, compute-in-memory, and memory-centric accelerators"
            priority: "Frontier"
            why: "Moving compute toward stored data attacks movement energy but complicates precision, programmability, and manufacturing."
            prediction: "Digital near-memory compute will reach narrow production roles before general-purpose analog compute-in-memory."
            watch: "Data-conversion overhead, supported precision, memory density loss, endurance, compiler mapping, and end-to-end speedup."
          - title: "Analog, mixed-signal, and photonic compute"
            priority: "Optional"
            why: "Non-digital approaches offer unusual efficiency envelopes but face accuracy, conversion, control, and integration hurdles."
            prediction: "These approaches will remain specialized unless conversion, calibration, and integration costs fall enough to preserve a system-level advantage."
            watch: "Application coverage, accuracy stability, ADC/DAC cost, programmability, manufacturing variation, and usable TCO."
      - title: "System bets"
        topics:
          - title: "MegaKernels, AI-generated kernels, and self-tuning systems"
            priority: "Frontier"
            why: "Automated end-to-end specialization could move architectural control from static runtimes into compilers and agents."
            prediction: "Persistent and mega-kernel execution will enter selected production decode paths while coexisting with modular serving runtimes."
            watch: "Model coverage, portability, scheduler flexibility, compilation time, debuggability, and reproducible gains under real traffic."
          - title: "Wafer-scale, modular chiplet, and resilient mega-cluster design"
            priority: "Frontier"
            why: "Future systems may trade monolithic scaling for composability and fault tolerance across radically larger physical units."
            prediction: "System form factors will diversify: wafer-scale integration for tightly coupled niches and chiplets for mainstream composability, rather than one replacing the other."
            watch: "Yield recovery, packaging capacity, interconnect semantics, software portability, fault domains, and full-system cost."
